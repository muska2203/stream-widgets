# Интерактивная история — конфигурация (см. docs/DESIGN.md)
# Все значения опциональны — при отсутствии используются дефолты из config.py.

channel = "namecodick"   # имя Twitch-канала (без #)
select_duration = 20.0   # секунд на выбор истории чатом
round_duration = 25.0    # секунд на ход целиком
outcome_pause = 3.0      # подсветка выбранного варианта зелёным
sleep_duration = 30.0    # сон между ходами: шапка с таймером + текст итога
end_pause = 15.0         # экран концовки перед новым выбором истории
# seed = 42              # фиксированный seed для детерминизма (мок-чат, ничьи)
overlay_port = 8765      # порт веб-оверлея (OBS Browser Source: http://127.0.0.1:8765)
mock_chat = false        # true = работа без Twitch (эмуляция чата)
