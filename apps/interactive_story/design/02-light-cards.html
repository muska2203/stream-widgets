<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оверлей «Интерактивная история» — макет 02 · Светлые карточки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
  /* ---------- база ---------------------------------------------------- */
  :root {
    --accent: #4c5fd5;           /* единственный акцент: сдержанный индиго */
    --accent-soft: rgba(76, 95, 213, .10);
    --accent-mid: rgba(76, 95, 213, .35);
    --card: rgba(255, 255, 255, .96);
    --ink: #171a26;              /* основной текст */
    --ink-dim: #5a6072;          /* вторичный текст */
    --danger: #d64545;
    --radius-lg: 18px;
    --radius-md: 14px;
    --shadow: 0 10px 30px rgba(10, 14, 40, .28), 0 2px 6px rgba(10, 14, 40, .18);
    --shadow-sm: 0 4px 14px rgba(10, 14, 40, .22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: transparent;
    font-family: 'Inter', 'Segoe UI', Georgia, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- демо-фон «картинка стрима» ------------------------------- */
  #stream-bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(120% 70% at 80% 0%, rgba(90, 60, 160, .55), transparent 60%),
      radial-gradient(90% 60% at 10% 90%, rgba(20, 90, 120, .55), transparent 60%),
      radial-gradient(45% 30% at 70% 65%, rgba(220, 120, 60, .30), transparent 70%),
      linear-gradient(160deg, #1b2138 0%, #10131f 55%, #0a0c14 100%);
  }
  #stream-bg::after {  /* лёгкий «шум сцены»: силуэты-пятна */
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(28% 22% at 25% 30%, rgba(255, 255, 255, .06), transparent 70%),
      radial-gradient(35% 28% at 75% 45%, rgba(0, 0, 0, .35), transparent 75%),
      radial-gradient(100% 100% at 50% 50%, transparent 55%, rgba(0, 0, 0, .45));
  }
  body.no-bg #stream-bg { display: none; }

  /* ---------- колонка контента ---------------------------------------- */
  #wrap {
    height: 100%;
    max-width: min(92vw, 620px);
    margin: 0 auto;
    padding: clamp(8px, 1.6vh, 18px) 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.4vh, 16px);
  }

  /* ---------- шапка (видна всегда) ------------------------------------ */
  #header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .55em;
    background: var(--card);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    padding: .5em 1.2em;
    font-size: clamp(13px, 1.9vh, 18px);
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #header .dot {
    flex: none;
    width: .55em; height: .55em;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .45; transform: scale(.8); }
  }
  #header .hdr-text { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- карточки общего вида ------------------------------------ */
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: clamp(12px, 2vh, 20px) clamp(14px, 2.4vh, 24px);
  }
  .fade-in { animation: fadeSlide .5s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- текст сцены / итога ------------------------------------- */
  .prose {
    font-family: 'Literata', Georgia, serif;
    font-size: clamp(15px, 2.3vh, 21px);
    line-height: 1.5;
    overflow-wrap: break-word;
  }
  .kicker {
    display: block;
    margin-bottom: .45em;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    font-size: .62em;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* ---------- списки позиций (варианты / истории) ---------------------- */
  .list { display: flex; flex-direction: column; gap: clamp(6px, 1.1vh, 12px); }
  .opt {
    display: flex;
    align-items: center;
    gap: .7em;
    background: var(--card);
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: .55em .8em .55em .6em;
    font-size: clamp(14px, 2.15vh, 20px);
    line-height: 1.35;
    animation: optIn .45s cubic-bezier(.2, .7, .3, 1) both;
    animation-delay: calc(var(--i, 0) * 70ms);
    transition: background-color .25s ease, border-color .25s ease,
                box-shadow .25s ease, transform .25s ease;
  }
  @keyframes optIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  .opt .num {
    flex: none;
    display: grid;
    place-items: center;
    width: 1.7em; height: 1.7em;
    border-radius: 9px;
    background: #eceef6;
    color: var(--ink-dim);
    font-weight: 800;
    font-size: .92em;
    font-variant-numeric: tabular-nums;
    transition: inherit;
  }
  .opt .body { flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }
  .opt .label { font-weight: 500; }
  .opt .hint {
    margin-top: .15em;
    font-size: .8em;
    font-weight: 400;
    color: var(--ink-dim);
    line-height: 1.35;
  }
  .opt .votes {
    flex: none;
    min-width: 2ch;               /* десятки-сотни не двигают текст */
    padding: .12em .5em;
    border-radius: 999px;
    background: #eceef6;
    color: var(--ink-dim);
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    font-size: .82em;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    transition: inherit;
  }
  .opt .votes:empty { display: none; }
  .opt .tag {
    flex: none;
    align-self: flex-start;
    font-size: .58em;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    padding-top: .5em;
  }

  /* есть голоса */
  .opt.active .num   { background: var(--accent-soft); color: var(--accent); }
  .opt.active .votes { background: var(--accent-soft); color: var(--accent); }

  /* лидер голосования */
  .opt.leader {
    background: #f4f6ff;
    border-color: var(--accent-mid);
    box-shadow: 0 6px 20px rgba(76, 95, 213, .30);
  }
  .opt.leader .num   { background: var(--accent); color: #fff; }
  .opt.leader .votes { background: var(--accent); color: #fff; }

  /* выбранный (победитель) */
  .opt.chosen {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 10px 26px rgba(76, 95, 213, .5);
    animation: chosenPop .55s cubic-bezier(.2, .9, .3, 1.4) both;
  }
  @keyframes chosenPop {
    0%   { transform: scale(.97); }
    60%  { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .opt.chosen .label, .opt.chosen .hint { color: #fff; }
  .opt.chosen .num   { background: rgba(255, 255, 255, .22); color: #fff; }
  .opt.chosen .votes { background: #fff; color: var(--accent); }
  .opt.chosen .tag   { color: rgba(255, 255, 255, .85); }
  .opt.dim { opacity: .55; }   /* проигравшие рядом с победителем */

  /* ---------- экран выбора истории ------------------------------------- */
  #select-title { text-align: center; }
  #select-title .prose { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 600; }

  /* ---------- экран сна: компактный итог -------------------------------- */
  #sleep .card { box-shadow: var(--shadow-sm); }
  #sleep .prose { font-size: clamp(14px, 2.1vh, 19px); }

  /* ---------- экран концовки (кульминация) ------------------------------- */
  #end {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #end .card {
    padding: clamp(20px, 4vh, 40px) clamp(18px, 3.4vh, 34px);
    text-align: center;
    animation: endIn .8s cubic-bezier(.2, .7, .3, 1) both;
  }
  @keyframes endIn {
    from { opacity: 0; transform: scale(.96) translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  #end-title {
    font-size: clamp(20px, 3.6vh, 34px);
    font-weight: 800;
    letter-spacing: .04em;
    margin-bottom: .5em;
  }
  #end-title .em { color: var(--accent); }
  #end-text {
    font-family: 'Literata', Georgia, serif;
    font-size: clamp(15px, 2.5vh, 23px);
    line-height: 1.55;
    color: var(--ink);
    overflow-wrap: break-word;
  }

  /* ---------- экран ошибки ---------------------------------------------- */
  #error .card {
    border: 2px solid rgba(214, 69, 69, .35);
    text-align: center;
  }
  #error .kicker { color: var(--danger); }
  #error .msg { font-size: clamp(14px, 2.2vh, 20px); font-weight: 500; }

  .hidden { display: none !important; }

  /* ---------- демо-панель (только для просмотра макета) ------------------ */
  #demo-panel {
    position: fixed;
    left: 50%; bottom: 10px;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    max-width: 96vw;
    padding: 6px;
    border-radius: 12px;
    background: rgba(20, 22, 34, .82);
    backdrop-filter: blur(6px);
    font-size: 11px;
    opacity: .35;
    transition: opacity .2s ease;
  }
  #demo-panel:hover { opacity: 1; }
  #demo-panel button {
    border: 0;
    border-radius: 8px;
    padding: 4px 9px;
    background: transparent;
    color: #cfd4e4;
    font: 600 11px 'Inter', 'Segoe UI', sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }
  #demo-panel button:hover { background: rgba(255, 255, 255, .12); }
  #demo-panel button.on { background: var(--accent); color: #fff; }
  #demo-panel .sep { width: 1px; background: rgba(255, 255, 255, .18); margin: 2px 2px; }
  #demo-hint {
    position: fixed;
    right: 10px; bottom: 10px;
    z-index: 10;
    color: rgba(255, 255, 255, .55);
    font: 500 10px 'Inter', 'Segoe UI', sans-serif;
    opacity: .6;
  }
  body.no-bg #demo-hint { color: rgba(0, 0, 0, .45); }
</style>
</head>
<body>
<div id="stream-bg"></div>

<div id="wrap">
  <div id="header">
    <span class="dot"></span>
    <span class="hdr-text" id="header-text"></span>
  </div>

  <section id="select" class="hidden">
    <div class="card fade-in" id="select-title">
      <div class="prose" id="select-title-text"></div>
    </div>
    <div class="list" id="select-list"></div>
  </section>

  <section id="move" class="hidden">
    <div class="card fade-in" id="scene">
      <span class="kicker">Сцена</span>
      <div class="prose" id="scene-text"></div>
    </div>
    <div class="list" id="options"></div>
  </section>

  <section id="sleep" class="hidden">
    <div class="card fade-in" id="result">
      <span class="kicker">Итог хода</span>
      <div class="prose" id="result-text"></div>
    </div>
  </section>

  <section id="end" class="hidden">
    <div class="card">
      <div id="end-title"></div>
      <div id="end-text"></div>
    </div>
  </section>

  <section id="error" class="hidden">
    <div class="card fade-in">
      <span class="kicker">Ошибка</span>
      <div class="msg" id="error-text"></div>
    </div>
  </section>
</div>

<div id="demo-panel">
  <button data-phase="select">1 Выбор</button>
  <button data-phase="scene">2 Сцена</button>
  <button data-phase="vote">3 Голоса</button>
  <button data-phase="outcome">4 Выбран</button>
  <button data-phase="sleep">5 Сон</button>
  <button data-phase="end">6 Финал</button>
  <button data-phase="error">7 Ошибка</button>
  <span class="sep"></span>
  <button id="bg-toggle" class="on">Фон стрима</button>
</div>
<div id="demo-hint">демо-панель макета · клавиши 1–7, B — фон</div>

<script>
"use strict";

/* ---------- демо-данные: реальные тексты из stories/*.toml -------------- */
const STORY = "Станция-13";

const DEMO = {
  select: {
    header: "Выбор истории · 25",
    title: "Выберите историю — пишите цифру в чат",
    items: [
      { n: 1, label: "Станция-13", votes: 14, state: "leader",
        hint: "Вы просыпаетесь на станции, где никого нет, а реактор перегревается. Эвакуация — вопрос времени." },
      { n: 2, label: "Ночной обоз", votes: 6, state: "active",
        hint: "Караван должен пройти проклятый лес до рассвета. Вы — его единственный охранник." },
      { n: 3, label: "Маяк на отмели", votes: 0, state: "idle",
        hint: "Последний смотритель маяка слышит в шторм стук снаружи. На четвёртом этаже." },
    ],
  },
  scene: {  // фаза move: текст сцены уже есть, варианты ещё не появились
    header: "«" + STORY + "» · Ход 1 · 30",
    scene: "Криокапсула открывается с шипением. Красная лампа будит хуже любого будильника: «ТРЕВОГА. ЭКИПАЖ ЭВАКУИРОВАН». Вы один на Станции-13.",
    options: null,
  },
  vote: {   // фаза move: идёт голосование
    header: "«" + STORY + "» · Ход 1 · 18",
    scene: "Криокапсула открывается с шипением. Красная лампа будит хуже любого будильника: «ТРЕВОГА. ЭКИПАЖ ЭВАКУИРОВАН». Вы один на Станции-13.",
    options: [
      { n: 1, label: "На мостик — узнать, что случилось", votes: 21, state: "leader" },
      { n: 2, label: "В лабораторию — там был эксперимент", votes: 9, state: "active" },
      { n: 3, label: "В грузовой отсек — собрать припасы", votes: 0, state: "idle" },
    ],
  },
  outcome: { // фаза move: голосование закрыто, победитель подсвечен
    header: "«" + STORY + "» · Ход 1 · 4",
    scene: "Криокапсула открывается с шипением. Красная лампа будит хуже любого будильника: «ТРЕВОГА. ЭКИПАЖ ЭВАКУИРОВАН». Вы один на Станции-13.",
    options: [
      { n: 1, label: "На мостик — узнать, что случилось", votes: 21, state: "chosen" },
      { n: 2, label: "В лабораторию — там был эксперимент", votes: 9, state: "active" },
      { n: 3, label: "В грузовой отсек — собрать припасы", votes: 0, state: "idle" },
    ],
  },
  sleep: {
    header: "«" + STORY + "» · Ход 2 · 45",
    result: "Мостик встречает мерцанием экранов и тишиной.",
  },
  end: {
    header: "«" + STORY + "» · Финал · 10",
    ending: {
      label: "Героическая концовка",
      text: "Реактор стабилизирован, «Июнь» забирает вас у шлюза. Станция-13 будет восстановлена, а на её мостике повесят вашу табличку.",
    },
  },
  error: {
    header: "Интерактивная история",
    message: "Не удалось загрузить истории: папка stories/ пуста или содержит ошибки. Проверьте файлы и перезапустите игру.",
  },
};

/* ---------- рендер ------------------------------------------------------- */
const $ = id => document.getElementById(id);
const SECTIONS = ["select", "move", "sleep", "end", "error"];

function restartFade(el) {
  el.classList.remove("fade-in");
  void el.offsetWidth;
  el.classList.add("fade-in");
}

function rowHTML(o, i) {
  const d = document.createElement("div");
  d.className = "opt";
  d.style.setProperty("--i", i);
  d.innerHTML = `<span class="num">${o.n}</span>` +
                `<span class="body"><span class="label"></span>` +
                (o.hint ? `<div class="hint"></div>` : ``) + `</span>` +
                (o.state === "leader" ? `<span class="tag">лидер</span>` : ``) +
                (o.state === "chosen" ? `<span class="tag">выбрано</span>` : ``) +
                `<span class="votes"></span>`;
  d.querySelector(".label").textContent = o.label;
  if (o.hint) d.querySelector(".hint").textContent = o.hint;
  return d;
}

function renderRows(container, items) {
  container.replaceChildren(...items.map(rowHTML));
  items.forEach((o, i) => {
    const el = container.children[i];
    el.className = "opt" + (o.state !== "idle" ? " " + o.state : "");
    el.style.setProperty("--i", i);
    el.querySelector(".votes").textContent = o.votes > 0 ? o.votes : "";
  });
}

function apply(phaseKey) {
  const s = DEMO[phaseKey];
  $("header-text").textContent = s.header;

  let visible;
  if (phaseKey === "select") {
    visible = "select";
    $("select-title-text").textContent = s.title;
    renderRows($("select-list"), s.items);
    restartFade($("select-title"));
  } else if (phaseKey === "scene" || phaseKey === "vote" || phaseKey === "outcome") {
    visible = "move";
    $("scene-text").textContent = s.scene;
    restartFade($("scene"));
    if (s.options) {
      $("options").classList.remove("hidden");
      // на экране исхода проигравшие приглушаем, остаются на месте
      const items = s.options.map(o =>
        phaseKey === "outcome" && o.state !== "chosen"
          ? Object.assign({}, o, { state: "dim" }) : o);
      renderRows($("options"), items);
    } else {
      $("options").classList.add("hidden");
      $("options").replaceChildren();
    }
  } else if (phaseKey === "sleep") {
    visible = "sleep";
    $("result-text").textContent = s.result;
    restartFade($("result"));
  } else if (phaseKey === "end") {
    visible = "end";
    $("end-title").textContent = s.ending.label || "КОНЕЦ";
    $("end-text").textContent = s.ending.text;
  } else if (phaseKey === "error") {
    visible = "error";
    $("error-text").textContent = s.message;
  }

  for (const name of SECTIONS)
    $(name).classList.toggle("hidden", name !== visible);
}

/* ---------- демо-переключатели -------------------------------------------- */
const phaseButtons = [...document.querySelectorAll("#demo-panel [data-phase]")];
function setPhase(key) {
  apply(key);
  phaseButtons.forEach(b =>
    b.classList.toggle("on", b.dataset.phase === key));
}
phaseButtons.forEach(b => b.addEventListener("click", () => setPhase(b.dataset.phase)));

const ORDER = ["select", "scene", "vote", "outcome", "sleep", "end", "error"];
document.addEventListener("keydown", e => {
  const i = parseInt(e.key, 10) - 1;
  if (i >= 0 && i < ORDER.length) setPhase(ORDER[i]);
  if (e.key === "b" || e.key === "B" || e.key === "и" || e.key === "И") toggleBg();
});

function toggleBg() {
  const off = document.body.classList.toggle("no-bg");
  $("bg-toggle").classList.toggle("on", !off);
}
$("bg-toggle").addEventListener("click", toggleBg);

setPhase("vote");
</script>
</body>
</html>
