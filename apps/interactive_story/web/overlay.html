<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Interactive Story — overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #382715;   /* основной текст на пергаменте */
    --ink-soft:   #5d4630;   /* приглушённый текст */
    --bronze:     #8a6134;   /* бронзовый акцент */
    --bronze-lit: #b98d4f;
    --bordeaux:   #7c2d2d;   /* бордо: выбранный вариант, ошибки */
    --parch-1:    #f0e2bd;   /* пергамент, светлый край */
    --parch-2:    #e2cd9e;   /* пергамент, тёмный край */
    --band:       #2b1e11;   /* тёмная шапка-полоса */
    --band-ink:   #e8d9b2;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: Alegreya, Georgia, 'Times New Roman', serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* --- колонка контента ------------------------------------------------ */
  #wrap {
    max-width: min(92vw, 46em);
    margin: 0 auto;
    padding: 17px 0 22px;
    font-size: 21px;
  }

  /* --- шапка: тёмная полоса с бронзовой каймой, всегда видна ----------- */
  #header {
    background: linear-gradient(180deg, #352615 0%, var(--band) 100%);
    color: var(--band-ink);
    border: 1px solid rgba(185, 141, 79, .55);
    border-bottom: 2px solid var(--bronze);
    border-radius: var(--radius) var(--radius) 0 0;
    box-shadow: 0 3px 14px rgba(0, 0, 0, .5);
    text-align: center;
    padding: .5em 1em .45em;
    font-family: 'Alegreya SC', Alegreya, Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: .05em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #header .sec { font-variant-numeric: tabular-nums; color: var(--bronze-lit); }

  /* --- пергаментная панель -------------------------------------------- */
  .panel {
    background:
      radial-gradient(140% 90% at 18% 0%, rgba(255, 250, 230, .55), transparent 55%),
      radial-gradient(120% 100% at 88% 100%, rgba(122, 84, 34, .22), transparent 60%),
      linear-gradient(168deg, var(--parch-1), var(--parch-2));
    border: 1px solid rgba(90, 60, 25, .55);
    border-radius: var(--radius);
    box-shadow:
      inset 0 0 1.6em rgba(110, 75, 30, .22),
      0 5px 20px rgba(0, 0, 0, .5);
    padding: .75em 1em;
  }

  /* --- сцена / итог ---------------------------------------------------- */
  #scene, #result {
    margin-top: 19px;
    font-size: 24px;
    line-height: 1.5;
    overflow-wrap: break-word;
  }
  #result {
    border-left: 4px solid var(--bronze);
    font-style: italic;
    color: #43301b;
  }
  .fade-in { animation: fadeSlide .5s ease both; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-7px); }
    to   { opacity: 1; transform: none; }
  }

  /* --- заголовок-подсказка выбора истории ------------------------------ */
  #select-title {
    margin-top: 22px;
    text-align: center;
    font-family: 'Alegreya SC', Alegreya, Georgia, serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--band-ink);
    background: rgba(43, 30, 17, .85);
    border: 1px solid rgba(185, 141, 79, .4);
    border-radius: var(--radius);
    padding: .4em 1em;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .45);
  }

  /* --- строки вариантов / историй -------------------------------------- */
  #options, #select-list { margin-top: 17px; }
  .opt {
    display: flex;
    align-items: baseline;
    gap: .65em;
    margin-top: 10px;
    padding: .5em .8em;
    border-radius: var(--radius);
    border: 1px solid rgba(90, 60, 25, .4);
    background:
      linear-gradient(170deg, rgba(240, 226, 189, .88), rgba(226, 205, 158, .88));
    box-shadow: 0 3px 12px rgba(0, 0, 0, .35);
    font-size: 22px;
    line-height: 1.35;
    overflow-wrap: break-word;
    transition: background-color .25s ease, box-shadow .25s ease,
                border-color .25s ease;
    animation: optIn .4s ease both;
    animation-delay: calc(var(--i, 0) * 60ms);
  }
  @keyframes optIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: none; }
  }
  .opt .num {
    font-family: 'Alegreya SC', Alegreya, Georgia, serif;
    font-weight: 700;
    color: var(--bronze);
    min-width: 1.35em;
    text-align: center;
    border: 1px solid rgba(138, 97, 52, .55);
    border-radius: 4px;
    padding: 0 .15em;
    background: rgba(255, 248, 225, .5);
  }
  .opt .body { flex: 1; min-width: 0; }
  .opt .label { color: var(--ink-soft); }
  .opt .votes {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--bronze);
    min-width: 1.7em;
    text-align: right;
  }
  .opt .votes:not(:empty)::after { content: " ✦"; font-size: .8em; }

  .opt.active {
    background:
      linear-gradient(170deg, rgba(216, 231, 188, .92), rgba(199, 219, 172, .92));
    border-color: rgba(110, 145, 70, .5);
  }
  .opt.active .label { color: var(--ink); }

  .opt.leader {
    background:
      linear-gradient(170deg, rgba(183, 214, 143, .96), rgba(153, 193, 113, .96));
    border: 1px solid #5e8a3c;
    box-shadow:
      0 0 0 1px rgba(130, 175, 85, .55),
      0 0 18px rgba(130, 175, 85, .5),
      0 3px 12px rgba(0, 0, 0, .35);
    animation: optIn .4s ease both, leaderBreathe 2.6s ease-in-out infinite;
    animation-delay: calc(var(--i, 0) * 60ms), .4s;
  }
  @keyframes leaderBreathe {
    0%, 100% { box-shadow: 0 0 0 1px rgba(130,175,85,.55), 0 0 12px rgba(130,175,85,.35), 0 3px 12px rgba(0,0,0,.35); }
    50%      { box-shadow: 0 0 0 1px rgba(130,175,85,.75), 0 0 22px rgba(130,175,85,.6), 0 3px 12px rgba(0,0,0,.35); }
  }
  .opt.leader .label { color: #2e4420; font-weight: 500; }
  .opt.leader .num {
    background: #5e8a3c;
    color: #f0f6e2;
    border-color: #5e8a3c;
  }

  .opt.chosen {
    background: linear-gradient(170deg, #79b34e, #4f7f2f);
    border-color: #3d6124;
    box-shadow: 0 0 26px rgba(110, 170, 70, .65), 0 4px 14px rgba(0,0,0,.45);
    animation: chosenStamp .55s ease both;
  }
  @keyframes chosenStamp {
    0%   { transform: scale(.97); }
    55%  { transform: scale(1.015); }
    100% { transform: scale(1); }
  }
  .opt.chosen .label, .opt.chosen .votes { color: #f2f8e6; }
  .opt.chosen .num {
    background: #f2f8e6;
    color: #3d6124;
    border-color: #f2f8e6;
  }
  .opt.chosen .label::after {
    content: " — выбрано";
    font-size: .78em;
    font-style: italic;
    color: #d8ecc0;
  }

  /* --- концовка (может перекрывать всю область) ------------------------ */
  #end {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 13px;
    text-align: center;
    padding: 32px 77px;
    background:
      radial-gradient(120% 90% at 50% 8%, rgba(255, 248, 224, .35), transparent 55%),
      linear-gradient(170deg, #2f2113 0%, #1d1409 100%);
    animation: fadeSlide .8s ease both;
  }
  #end-title {
    font-family: 'Alegreya SC', Alegreya, Georgia, serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: .07em;
    color: var(--band-ink);
    text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
    max-width: 22em;
  }
  #end-divider {
    color: var(--bronze-lit);
    font-size: 30px;
    letter-spacing: .5em;
    padding-left: .5em;
  }
  #end-text {
    font-size: 27px;
    line-height: 1.55;
    color: #d9c89f;
    max-width: 27em;
    overflow-wrap: break-word;
  }

  /* --- ошибка ---------------------------------------------------------- */
  #error {
    margin-top: 24px;
    text-align: center;
    color: var(--bordeaux);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.4;
    border-color: rgba(124, 45, 45, .6);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="header"></div>

  <section id="select" class="hidden">
    <div id="select-title"></div>
    <div id="select-list"></div>
  </section>

  <section id="move" class="hidden">
    <div id="scene" class="panel"></div>
    <div id="options"></div>
  </section>

  <section id="sleep" class="hidden">
    <div id="result" class="panel"></div>
  </section>

  <div id="error" class="panel hidden"></div>
</div>

<section id="end" class="hidden">
  <div id="end-title"></div>
  <div id="end-divider">❦ ❦ ❦</div>
  <div id="end-text"></div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const sections = ["select", "move", "sleep", "end", "error"];
// Структурные подписи: DOM пересобираем только при смене структуры,
// чтобы не перезапускать CSS-анимации на каждый опрос.
let phase = "", sceneSig = "", optsSig = "", selSig = "", resultSig = "";

function restartFade(el) {
  el.classList.remove("fade-in");
  void el.offsetWidth;  // reflow: перезапуск анимации
  el.classList.add("fade-in");
}

function setHeader(text) {
  const el = $("header");
  // секунды в конце строки выделяем классом (tabular-nums),
  // чтобы отсчёт не дёргал ширину шапки
  const m = text.match(/^(.*?)(\d+)$/);
  if (m) {
    el.textContent = m[1];
    const s = document.createElement("span");
    s.className = "sec";
    s.textContent = m[2];
    el.append(s);
  } else {
    el.textContent = text;
  }
}

function rowHTML(o, i) {
  const d = document.createElement("div");
  d.className = "opt";
  d.style.setProperty("--i", i);
  d.innerHTML = `<span class="num">${o.n}</span>` +
                `<span class="body"><span class="label"></span></span>` +
                `<span class="votes"></span>`;
  d.querySelector(".label").textContent = o.label;
  return d;
}

function updateRows(container, items) {
  const kids = container.children;
  for (let i = 0; i < items.length; i++) {
    const o = items[i], el = kids[i];
    el.className = "opt" + (o.state !== "idle" ? " " + o.state : "");
    el.querySelector(".votes").textContent = o.votes > 0 ? o.votes : "";
  }
}

function apply(s) {
  setHeader(s.header || "");
  if (s.phase !== phase) {
    phase = s.phase;
    for (const name of sections)
      $(name).classList.toggle("hidden", name !== phase);
    sceneSig = optsSig = selSig = resultSig = "";
  }
  if (phase === "select") {
    if (s.select.title) $("select-title").textContent = s.select.title;
    const sig = s.select.items.map(o => o.label).join("");
    if (sig !== selSig) {
      selSig = sig;
      $("select-list").replaceChildren(...s.select.items.map(rowHTML));
    }
    updateRows($("select-list"), s.select.items);
  } else if (phase === "move") {
    if (s.scene !== sceneSig) {
      sceneSig = s.scene;
      const sc = $("scene");
      sc.textContent = s.scene;
      restartFade(sc);
    }
    const sig = s.options.map(o => o.label).join("");
    if (sig !== optsSig) {
      optsSig = sig;
      $("options").replaceChildren(...s.options.map(rowHTML));
    }
    updateRows($("options"), s.options);
  } else if (phase === "sleep") {
    if (s.result !== resultSig) {
      resultSig = s.result;
      const r = $("result");
      r.textContent = s.result;
      restartFade(r);
    }
  } else if (phase === "end") {
    $("end-title").textContent = s.ending.label || "КОНЕЦ";
    $("end-text").textContent = s.ending.text;
  } else if (phase === "error") {
    $("error").textContent = s.select.message || "";
  }
}

function poll() {
  fetch("state.json", {cache: "no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(s => { if (s) apply(s); })
    .catch(() => {});
}
poll();
setInterval(poll, 200);
</script>
</body>
</html>
