# Станция-13 — sci-fi история. Чат выводит героя с молчащей космической станции.

[meta]
title = "Станция-13"
description = "Вы просыпаетесь на станции, где никого нет, а реактор перегревается. Эвакуация — вопрос времени."
start = "intro"

[nodes.intro]
text = """
Криокапсула открывается с шипением. Красная лампа будит хуже любого будильника: «ТРЕВОГА. ЭКИПАЖ ЭВАКУИРОВАН». Вы один на Станции-13.
"""
[[nodes.intro.options]]
text = "На мостик — узнать, что случилось"
result = "Мостик встречает мерцанием экранов и тишиной."
next = "bridge"
[[nodes.intro.options]]
text = "В лабораторию — там был эксперимент"
result = "Дверь лаборатории приоткрыта. Это плохой знак."
next = "lab"
[[nodes.intro.options]]
text = "В грузовой отсек — собрать припасы"
result = "Грузовой отсек огромен и очень тёмный."
next = "cargo"

[nodes.bridge]
text = """
Журнал корабля: экипаж эвакуировался шесть часов назад из-за сбоя реактора. Последняя запись капитана обрывается на полуслове. Связь молчит — антенна смотрит в пустоту.
"""
[[nodes.bridge.options]]
text = "Проверить систему связи"
result = "Вы перезапускаете передатчик и ловите сигнал!"
next = "comms"
[[nodes.bridge.options]]
text = "Спуститься к реактору"
result = "Лифт скрипит вниз, к сердцу станции."
next = "engine"

[nodes.lab]
text = """
Лаборатория разгромлена изнутри. Капсула с «образцом Ксено-7» вскрыта, на полу — царапины, ведущие к вентиляции. Что-то на станции всё же есть.
"""
[[nodes.lab.options]]
text = "Заблокировать лабораторию и уйти"
result = "Дверь закрывается. Где-то в вентиляции скребутся."
next = "corridor"
[[nodes.lab.options]]
text = "Быстро бежать прочь"
result = "Вы уносите ноги по тёмному коридору."
next = "corridor"

[nodes.cargo]
text = """
Среди контейнеров — свежая консервная банка. Ещё тёплая. Из-за штабеля выходит инженер Рао: он проспал эвакуацию в грузовом мехе.
"""
[[nodes.cargo.options]]
text = "Взять Рао с собой"
result = "Рао знает все коды станции. Повезло!"
next = "corridor"
[[nodes.cargo.options]]
text = "Оставить его и забрать припасы"
result = "Рао молча смотрит вслед. Припасы тяжёлые."
next = "corridor"

[nodes.corridor]
text = """
Главный коридор мигает аварийным светом. Слева — путь к реактору и шлюзам, справа — тёмная вентиляция, откуда пахнет озоном и чем-то живым.
"""
[[nodes.corridor.options]]
text = "К реактору"
result = "Тепло растёт с каждым шагом."
next = "engine"
[[nodes.corridor.options]]
text = "К спасательному шлюзу"
result = "Шлюзовая палуба. Капсулы на месте."
next = "airlock"

[nodes.comms]
text = """
Сигнал! Патрульный корвет «Июнь»: «Держитесь, будем через 40 минут. Но ваш реактор критичен — если перегрев не снять, мы не успеем».
"""
[[nodes.comms.options]]
text = "Бежать к шлюзу и ждать спасателей"
result = "Вы ждёте у шлюза, считая минуты."
next = "end_rescue"
[[nodes.comms.options]]
text = "Сначала остановить перегрев"
result = "Благородно. Осталось выжить при этом."
next = "reactor"

[nodes.engine]
text = """
Машинное отделение дышит жаром. Реактор на 92% перегрева. Рядом пульт: ручное управление стержнями. Автоматика давно сдалась.
"""
[[nodes.engine.options]]
text = "Взять управление на себя"
result = "Вы подходите к пульту. Руки помнят инструктаж."
next = "reactor"
[[nodes.engine.options]]
text = "Бежать к шлюзу"
result = "Реактор гудит вам в спину."
next = "airlock"

[nodes.reactor]
text = """
Пульт требует решения: вручную вогнать стержни — надёжно, но придётся остаться до конца; или катапультировать активную зону — станция потеряет питание, но взрыва не будет.
"""
[[nodes.reactor.options]]
text = "Вогнать стержни вручную"
result = "Стержни входят. Температура падает. Вы успеваете к шлюзу впритык."
next = "end_hero"
[[nodes.reactor.options]]
text = "Катапультировать активную зону"
result = "Зона уходит в пустоту. Станция гаснет и начинает дрейф."
next = "end_drift"

[nodes.airlock]
text = """
Спасательная капсула на одного. За иллюминатором — звёзды и никуда не спешащая станция. Вентиляция за спиной скребётся всё ближе.
"""
[[nodes.airlock.options]]
text = "Запустить капсулу сейчас"
result = "Капсула выстреливает в темноту."
next = "end_pod"
[[nodes.airlock.options]]
text = "Подождать и осмотреться"
result = "Вы ждёте. Скрежет приближается."
next = "end_stay"

[nodes.end_rescue]
text = "«Июнь» пришвартовывается за минуту до критического пика. Станция погибает, но вы смотрите на это из тёплого катера с кружкой кофе."
ending = true
ending_label = "Хорошая концовка"

[nodes.end_hero]
text = "Реактор стабилизирован, «Июнь» забирает вас у шлюза. Станция-13 будет восстановлена, а на её мостике повесят вашу табличку."
ending = true
ending_label = "Героическая концовка"

[nodes.end_drift]
text = "Станция дрейфует тёмная и холодная, но целая. Спасатели находят вас через два дня — закутанного в изопленку, злого и живого."
ending = true
ending_label = "Горькая концовка"

[nodes.end_pod]
text = "Капсула летит к ближайшему маяку. Станция за окном вспыхивает звездой. Вы один, зато живой и с отличным видом."
ending = true
ending_label = "Нейтральная концовка"

[nodes.end_stay]
text = "Скрежет выходит из вентиляции. Образец Ксено-7 рад встрече. Станция-13 больше не молчит — она урчит."
ending = true
ending_label = "Плохая концовка"
