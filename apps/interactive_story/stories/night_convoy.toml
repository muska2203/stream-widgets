# Ночной обоз — фэнтези-история. Чат ведёт караван через ночной лес.

[meta]
title = "Ночной обоз"
description = "Караван должен пройти проклятый лес до рассвета. Вы — его единственный охранник."
start = "intro"

[nodes.intro]
text = """
Солнце садится. Купец Гарон торопит: три повозки с солью должны выйти из леса до рассвета, иначе сделка сорвётся. Впереди три пути:
"""
[[nodes.intro.options]]
text = "Идти напрямик через чащу"
result = "Повозки скрипят по узкой тропе. Деревья смыкаются над головой."
next = "forest"
[[nodes.intro.options]]
text = "В объезд через старый мост"
result = "Вы сворачиваете к реке. Мост скрипит на ветру."
next = "bridge"
[[nodes.intro.options]]
text = "Встать лагерем до утра"
result = "Костёр разведён, но лес не спит."
next = "camp"

[nodes.forest]
text = """
В темноте между деревьями загораются жёлтые глаза — стая волков идёт по следу. До края чащи ещё далеко.
"""
[[nodes.forest.options]]
text = "Зажечь факелы и идти напролом"
result = "Волки не любят огонь, но один всё же прыгнул на упряжь!"
next = "wolves_fight"
[[nodes.forest.options]]
text = "Тихо увести караван в сторону"
result = "Вы уходите с тропы и натыкаетесь на чьё-то лежбище."
next = "thicket"

[nodes.thicket]
text = """
Под корнями дуба стонет раненый торговец — на него напали волки час назад. Рядом валяется его разграбленная поклажа.
"""
[[nodes.thicket.options]]
text = "Перевязать его и взять с собой"
result = "Торговец в благодарность показывает охотничью тропу."
next = "deep_forest"
[[nodes.thicket.options]]
text = "Оставить и уйти дальше"
result = "Стон остаётся позади. Совесть молчит, лес — нет."
next = "deep_forest"

[nodes.wolves_fight]
text = """
Короткая схватка: огонь, крики, щёлканье зубов. Стая отступает, но одна повозка потеряла колесо — придётся бросить часть соли.
"""
[[nodes.wolves_fight.options]]
text = "Бросить груз и уходить быстрее"
result = "Облегчённый караван катится вперёд."
next = "deep_forest"

[nodes.deep_forest]
text = """
Лес становится совсем чужим: тропа пропала, компас крутится. Вдалеке мерцает огонёк, а над деревьями вот-вот забрезжит рассвет.
"""
[[nodes.deep_forest.options]]
text = "Идти на огонёк"
result = "Огонёк ведёт к избушке на курьих ножках..."
next = "witch_hut"
[[nodes.deep_forest.options]]
text = "Лезть на дерево и ждать рассвет"
result = "Сверху видно: до опушки рукой подать!"
next = "end_dawn"

[nodes.witch_hut]
text = "Избушка поворачивается к вам сама. Хозяйка предлагает чай и карты таро. Караван вышел из леса три дня спустя — все живы, но никто не помнит, как."
ending = true
ending_label = "Странная концовка"

[nodes.end_dawn]
text = "Рассвет застал караван у самой опушки. Соль доставлена, Гарон доволен, а вы больше никогда не пойдёте в этот лес."
ending = true
ending_label = "Хорошая концовка"

[nodes.bridge]
text = """
Мост через ущелье держится на честном слове. Под ним кто-то кашляет: тролль Мрамор требует плату за проход — десять мешков соли.
"""
[[nodes.bridge.options]]
text = "Заплатить солью"
result = "Тролль честно пропускает караван и даже держит верёвки."
next = "crossing"
[[nodes.bridge.options]]
text = "Прорваться силой"
result = "Мост не выдерживает двухметровой дубины..."
next = "end_troll"
[[nodes.bridge.options]]
text = "Развернуться и встать лагерем"
result = "Вы возвращаетесь подальше от ущелья."
next = "camp"

[nodes.crossing]
text = "Последние доски остаются позади. На том берегу уже светает — лес отпустил вас за цену десяти мешков соли."
ending = true
ending_label = "Хорошая концовка"

[nodes.end_troll]
text = "Мост рушится в ущелье вместе с передней повозкой. Караван разворачивается и уходит домой ни с чем. Тролль, кажется, махал вслед."
ending = true
ending_label = "Плохая концовка"

[nodes.camp]
text = """
Ночь в лагере тянется медленно. За кругом света шуршат кусты, и шорох движется по кругу — кто-то изучает вашу оборону.
"""
[[nodes.camp.options]]
text = "Организовать дозор всю ночь"
result = "В третьем часу дозорный замечает лучников на холме."
next = "watcher"
[[nodes.camp.options]]
text = "Выставить одного часового и спать"
result = "Часовой задремал у костра..."
next = "end_eaten"

[nodes.watcher]
text = """
Разбойники! Человек десять, ждут рассвета, чтобы напасть. Дозорный тихо будит вас: можно встретить их организованно или попробовать увести караван в темноте.
"""
[[nodes.watcher.options]]
text = "Готовить засаду наоборот"
result = "Разбойники натыкаются на готовых к бою людей и бегут."
next = "end_ambush"
[[nodes.watcher.options]]
text = "Тихо увести караван в ночь"
result = "Вы уходите в темноту, бросив костёр гореть."
next = "end_coward"

[nodes.end_ambush]
text = "Разбойники разбежались, бросив добычу прошлых грабежей. Караван выходит из леса к рассвету — с солью и с трофеями."
ending = true
ending_label = "Отличная концовка"

[nodes.end_coward]
text = "Караван спасся, но половина соли осталась в брошенных повозках. Гарон не заплатил премию. Ночь прошла — гордость не вернуть."
ending = true
ending_label = "Нейтральная концовка"

[nodes.end_eaten]
text = "Утром лагерь пуст: повозки целы, людей нет. Волки благодарят часового за невнимательность."
ending = true
ending_label = "Плохая концовка"
