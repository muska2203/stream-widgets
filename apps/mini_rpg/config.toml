# Мини-RPG — конфигурация (см. docs/DESIGN.md)
# Все значения опциональны — при отсутствии используются дефолты из config.py.

channel = "namecodick"              # имя Twitch-канала (без #)
event_duration = 15.0     # секунд на выбор двери чатом
combat_duration = 12.0    # секунд на одно голосование в бою (атака или защита)
combat_outcome_pause = 2.5  # показ итога хода боя до следующего голосования
levelup_duration = 15.0   # секунд на выбор статы при апе уровня
shop_duration = 25.0      # секунд на голосование в магазине
combat_end_pause = 4.0    # пауза после боя до следующего события
gameover_pause = 15.0     # экран итогов забега перед новым забегом
base_hp = 20              # базовое HP героя (итог: base_hp + 5×выносливость)
# seed = 42               # фиксированный seed для детерминизма (мок-чат, ничьи)
overlay_port = 8766       # порт веб-оверлея (OBS Browser Source: http://127.0.0.1:8766)
mock_chat = false         # true = работа без Twitch (эмуляция чата)
