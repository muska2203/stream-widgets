# Мини-RPG — конфигурация (см. docs/DESIGN.md)
# Все значения опциональны — при отсутствии используются дефолты из config.py.

channel = "namecodick"              # имя Twitch-канала (без #)
event_duration = 25.0     # секунд на выбор двери чатом
hero_cooldown = 8.0       # базовый кулдаун атаки героя, сек (снижается Ловкостью)
agility_cd_reduction = 0.3 # −сек к кулдауну героя за каждое очко Ловкости
min_cooldown = 1.0        # нижний предел кулдауна атаки героя, сек
chatter_cd_min = 3.0      # диапазон случайного кулдауна атаки чаттера отряда, сек
chatter_cd_max = 8.0
chat_damage_pct = 5       # DPS каждого чаттера отряда = % от среднего DPS героя (калибровка урона)
chat_damage_cap_pct = 100 # макс. число АТАКУЮЩИХ в отряде = cap // pct (сверх капа — стоят на поле)
levelup_duration = 25.0   # секунд на выбор статы при апе уровня
shop_duration = 25.0      # секунд на голосование в магазине
overtime_duration = 5.0   # овертайм при 0 голосов: раунд продолжается (один раз), потом случайный выбор
combat_end_pause = 10.0    # пауза после боя до следующего события
gameover_pause = 15.0     # экран итогов забега перед новым забегом
base_hp = 20              # базовое HP героя (итог: base_hp + 5×выносливость)
# seed = 42               # фиксированный seed для детерминизма (мок-чат, ничьи)
vote_mode = "classic"     # "words" — случайные слова раунда; "classic" — фиксированные команды (левая, сила, выход...)
overlay_port = 8766       # порт веб-оверлея (OBS Browser Source: http://127.0.0.1:8766)
mock_chat = false         # true = работа без Twitch (эмуляция чата)
